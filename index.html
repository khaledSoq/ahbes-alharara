<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123A6B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache" />

  <title>احبس الحرارة | Al-Tamaize</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=20260903d" />
  <script>
    (function () {
      var p = location.pathname;
      if (!/\/$|\.html$/i.test(p)) {
        location.replace(p + "/" + location.search + location.hash);
      }
    })();
  </script>
</head>
<body>
  <!-- playtest-patch-4 2026-09-03 -->
  <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="logo-lockup" viewBox="0 0 640 340">
      <defs>
        <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#123A6B"/>
          <stop offset="38%" stop-color="#123A6B"/>
          <stop offset="100%" stop-color="#E31B23"/>
        </linearGradient>
      </defs>
      <path d="M52 150 C 150 58, 340 42, 540 108" fill="none" stroke="#123A6B" stroke-width="34" stroke-linecap="round"/>
      <path d="M140 200 C 270 252, 455 220, 568 118" fill="none" stroke="url(#sw)" stroke-width="18" stroke-linecap="round"/>
      <g transform="translate(170,74)">
        <rect x="2" y="22" width="14" height="50" rx="3" fill="#123A6B" transform="rotate(-32 9 47)"/>
        <rect x="18" y="12" width="13" height="46" rx="3" fill="#E31B23" transform="rotate(-32 24 35)"/>
        <rect x="32" y="4" width="13" height="42" rx="3" fill="#123A6B" transform="rotate(-32 38 25)"/>
        <path d="M56 6 L176 6 L160 30 L118 30 L76 132 L38 132 L86 30 L56 30 Z" fill="#E31B23"/>
      </g>
      <text x="320" y="286" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">
        <tspan fill="#123A6B">Al-</tspan><tspan fill="#E31B23">T</tspan><tspan fill="#123A6B">amaize</tspan>
      </text>
      <text x="320" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#123A6B" letter-spacing="6.5">COATING &amp; PAINTING</text>
    </symbol>
    <symbol id="logo-mark" viewBox="0 0 220 130">
      <path d="M14 74 C 56 22, 128 14, 204 50" fill="none" stroke="#123A6B" stroke-width="18" stroke-linecap="round"/>
      <path d="M46 98 C 104 122, 160 108, 204 56" fill="none" stroke="#E31B23" stroke-width="10" stroke-linecap="round"/>
      <path d="M84 34 L148 34 L136 52 L112 52 L86 112 L62 112 L90 52 L84 52 Z" fill="#E31B23"/>
    </symbol>
  </svg>

  <div id="frame">
    <div id="stage" data-state="start">
      <canvas id="fx"></canvas>
      <div id="heat" aria-hidden="true"></div>
      <div id="cool" aria-hidden="true"></div>

      <section id="screen-start" class="screen">
        <div class="logo-pill" aria-label="Al-Tamaize">
          <img class="logo-img" src="assets/logo-al-tamaize.png?v=20260903d" alt="" />
          <svg class="logo-fallback" viewBox="0 0 640 340" role="img" aria-hidden="true">
            <use href="#logo-lockup" xlink:href="#logo-lockup" width="640" height="340"></use>
          </svg>
          <p class="ar-name">التميز</p>
        </div>
        <h1 class="title">احبس الحرارة</h1>
        <p class="subtitle">وقف التسريب</p>
        <button id="btn-start" class="btn btn-navy" type="button">ابدأ</button>
        <p class="hint">امسك على الشقوق عشان تعزل</p>
      </section>

      <section id="screen-play" class="screen" hidden>
        <div class="hud-top">
          <div class="chip chip-bill" id="bill-chip">
            <span class="chip-label">فاتورة التكييف</span>
            <span class="chip-value"><span id="bill-num">480</span> ر.س</span>
          </div>
          <div class="hud-mark" aria-hidden="true">
            <img class="logo-img hud-img" src="assets/logo-symbol.png?v=20260903d" alt="" />
            <svg class="logo-fallback hud-svg" viewBox="0 0 220 130" aria-hidden="true">
              <use href="#logo-mark" xlink:href="#logo-mark" width="220" height="130"></use>
            </svg>
          </div>
          <div class="timer" id="timer">15.0</div>
        </div>
        <div class="chip chip-fill" id="fill-chip">
          <div class="fill-row">
            <span>نسبة العزل</span>
            <span id="fill-num">0%</span>
          </div>
          <div class="bar"><i id="fill-bar"></i></div>
        </div>
        <div class="hint-pill" id="hold-hint">امسك على الشقوق</div>
      </section>

      <section id="screen-end" class="screen" hidden>
        <div class="end-card" id="end-card">
          <div class="logo-pill logo-pill-end">
            <img class="logo-img" src="assets/logo-al-tamaize.png?v=20260903d" alt="" />
            <svg class="logo-fallback" viewBox="0 0 640 340" role="img" aria-hidden="true">
              <use href="#logo-lockup" xlink:href="#logo-lockup" width="640" height="340"></use>
            </svg>
          </div>
          <div class="badge" id="badge">
            <span class="badge-k">ضمان</span>
            <span class="badge-n">10</span>
            <span class="badge-k">سنوات</span>
          </div>
          <p class="end-bill" id="end-bill" hidden>
            فاتورة التكييف:
            <s id="bill-from">580</s>
            <span class="bill-to"><span id="bill-to">310</span> ر.س</span>
          </p>
          <p class="end-copy" id="end-copy"></p>
          <p class="end-sub" id="end-sub"></p>
          <a id="btn-wa" class="btn btn-wa" target="_blank" rel="noopener">اطلب فحص مجاني</a>
          <a id="btn-site" class="btn btn-site" href="https://altamaize.com/" target="_blank" rel="noopener">زيارة موقعنا</a>
          <button id="btn-replay" class="btn btn-ghost" type="button">العب مرة ثانية</button>
        </div>
      </section>
    </div>
  </div>
  <script src="game.js?v=20260903d"></script>
</body>
</html>
