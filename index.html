<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#123A6B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="احبس الحرارة — وقف التسريب. لعبة عزل حراري من Al-Tamaize." />
  <title>احبس الحرارة | Al-Tamaize</title>
  <base href="./" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="logo-lockup" viewBox="0 0 640 340">
      <defs>
        <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#123A6B"/>
          <stop offset="42%" stop-color="#123A6B"/>
          <stop offset="100%" stop-color="#E31B23"/>
        </linearGradient>
      </defs>
      <path d="M58 148 C 155 62, 330 48, 528 108" fill="none" stroke="#123A6B" stroke-width="36" stroke-linecap="round"/>
      <path d="M148 198 C 268 250, 448 222, 558 122" fill="none" stroke="url(#sw)" stroke-width="18" stroke-linecap="round"/>
      <g transform="translate(168,76)">
        <rect x="2" y="22" width="15" height="50" rx="3" fill="#123A6B" transform="rotate(-32 10 47)"/>
        <rect x="18" y="12" width="14" height="46" rx="3" fill="#E31B23" transform="rotate(-32 25 35)"/>
        <rect x="32" y="4" width="14" height="42" rx="3" fill="#123A6B" transform="rotate(-32 39 25)"/>
        <path d="M58 6 L176 6 L160 30 L120 30 L78 132 L40 132 L88 30 L58 30 Z" fill="#E31B23"/>
      </g>
      <text x="320" y="286" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">
        <tspan fill="#123A6B">Al-</tspan><tspan fill="#E31B23">T</tspan><tspan fill="#123A6B">amaize</tspan>
      </text>
      <text x="320" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#123A6B" letter-spacing="6.5">COATING & PAINTING</text>
    </symbol>
    <symbol id="logo-mark" viewBox="0 0 220 130">
      <path d="M16 74 C 58 24, 130 16, 200 50" fill="none" stroke="#123A6B" stroke-width="18" stroke-linecap="round"/>
      <path d="M48 96 C 102 120, 158 108, 202 56" fill="none" stroke="#E31B23" stroke-width="10" stroke-linecap="round"/>
      <path d="M86 36 L148 36 L136 54 L112 54 L88 112 L64 112 L92 54 L86 54 Z" fill="#E31B23"/>
    </symbol>
  </svg>

  <div id="frame">
    <div id="stage" data-state="start">
      <canvas id="fx"></canvas>
      <div id="heat" aria-hidden="true"></div>
      <div id="cool" aria-hidden="true"></div>

      <section id="screen-start" class="screen">
        <div class="logo-pill" aria-label="Al-Tamaize">
          <img class="logo-img" src="assets/logo-al-tamaize.png" alt="" />
          <svg class="logo-fallback" hidden><use href="#logo-lockup"></use></svg>
          <p class="ar-name">التميز</p>
        </div>
        <h1 class="title">احبس الحرارة</h1>
        <p class="subtitle">وقف التسريب</p>
        <button id="btn-start" class="btn btn-navy" type="button">ابدأ</button>
        <p class="hint">امسك على الشقوق عشان تعزل</p>
      </section>

      <section id="screen-play" class="screen" hidden>
        <div class="hud-top">
          <div class="chip chip-bill" id="bill-chip">
            <span class="chip-label">فاتورة التكييف</span>
            <span class="chip-value"><span id="bill-num">480</span> ر.س</span>
          </div>
          <div class="hud-mark" aria-hidden="true">
            <img class="logo-img hud-img" src="assets/logo-symbol.png" alt="" />
            <svg class="logo-fallback hud-svg" hidden><use href="#logo-mark"></use></svg>
          </div>
          <div class="timer" id="timer">8.0</div>
        </div>
        <div class="chip chip-fill" id="fill-chip">
          <div class="fill-row">
            <span>نسبة العزل</span>
            <span id="fill-num">0%</span>
          </div>
          <div class="bar"><i id="fill-bar"></i></div>
        </div>
        <div class="hint-pill" id="hold-hint">امسك على الشقوق</div>
      </section>

      <section id="screen-end" class="screen" hidden>
        <div class="end-card" id="end-card">
          <div class="logo-pill logo-pill-end">
            <img class="logo-img" src="assets/logo-al-tamaize.png" alt="" />
            <svg class="logo-fallback" hidden><use href="#logo-lockup"></use></svg>
          </div>
          <div class="badge" id="badge">
            <span class="badge-k">ضمان</span>
            <span class="badge-n">10</span>
            <span class="badge-k">سنوات</span>
          </div>
          <p class="end-bill" id="end-bill" hidden>
            فاتورة التكييف:
            <s id="bill-from">580</s>
            <span class="bill-to"><span id="bill-to">310</span> ر.س</span>
          </p>
          <p class="end-copy" id="end-copy"></p>
          <p class="end-sub" id="end-sub"></p>
          <a id="btn-wa" class="btn btn-wa" target="_blank" rel="noopener">اطلب فحص مجاني</a>
          <button id="btn-replay" class="btn btn-ghost" type="button">العب مرة ثانية</button>
        </div>
      </section>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
